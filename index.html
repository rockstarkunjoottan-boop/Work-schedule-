<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work Schedule</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B5E7B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: drawing-sheet title block on top, then Activities / Timeline / Changes tabs; edits happen in bottom sheets. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --ink:#18232B; --muted:#586770; --line:#D2D9DE;
  --accent:#1B5E7B; --accent-ink:#FFFFFF; --accent-soft:#DDEAF0;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --warn:#9C5B00; --warn-soft:#F8E7C8; --bad:#B0352C; --bad-soft:#F6DAD6;
  --sun:#E3E8EB; --shadow:0 -6px 30px rgba(10,25,35,.18);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171C; --surface:#19232A; --ink:#E5ECEF; --muted:#94A3AD; --line:#2B3841;
  --accent:#6DB7D6; --accent-ink:#0B1A22; --accent-soft:#1C3441;
  --ok:#6CC48E; --ok-soft:#1B3326; --warn:#E6AB4D; --warn-soft:#3A2D14; --bad:#F08C82; --bad-soft:#3D1F1C;
  --sun:#1E292F; --shadow:0 -6px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171C; --surface:#19232A; --ink:#E5ECEF; --muted:#94A3AD; --line:#2B3841;
  --accent:#6DB7D6; --accent-ink:#0B1A22; --accent-soft:#1C3441;
  --ok:#6CC48E; --ok-soft:#1B3326; --warn:#E6AB4D; --warn-soft:#3A2D14; --bad:#F08C82; --bad-soft:#3D1F1C;
  --sun:#1E292F; --shadow:0 -6px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:920px;margin:0 auto;padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* title block */
.tb{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tb-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 0}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tb-actions{display:flex;gap:6px;flex-wrap:wrap}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}
.prog{height:6px;border-radius:3px;background:var(--sun);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--ok)}
.next{margin-top:7px;font-size:13px;color:var(--muted)}
h1{margin:6px 0 0;padding:0 14px 12px;font:700 clamp(28px,8vw,40px)/1.02 var(--f-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.tb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);margin:0}
.tb-grid>div{background:var(--surface);padding:10px 14px;min-width:0}
.tb-grid dt{font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tb-grid dd{margin:4px 0 0;font:600 22px/1.1 var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tb-grid dd small{display:block;margin-top:3px;font:400 12px/1.3 var(--f-body);letter-spacing:0;color:var(--muted)}
.tone-ok{color:var(--ok)} .tone-warn{color:var(--warn)} .tone-bad{color:var(--bad)}
@media (min-width:640px){.tb-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-sm{min-height:32px;padding:5px 10px;font-size:13px}

/* banners */
.note{border:1px solid var(--line);border-left-width:4px;background:var(--surface);border-radius:6px;padding:10px 12px;font-size:14px}
.note.warn{border-left-color:var(--warn)} .note.bad{border-left-color:var(--bad)}
.note h3{margin:0 0 6px;font:600 16px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.attn-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.attn-row:first-of-type{border-top:0}
.attn-row span.t{min-width:0;flex:1 1 200px}
.attn-btns{display:flex;gap:6px;flex-wrap:wrap}

/* tabs */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:500;color:var(--muted);min-height:38px;white-space:nowrap}
.seg{max-width:100%}
@media (max-width:400px){.seg button{padding:8px 8px;font-size:14px}}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.act{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 13px;min-width:0}
.act:hover{border-color:var(--accent)}
.act-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.act-name{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.act-dates{margin-top:3px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.act-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{flex:none;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.upcoming{background:var(--sun);color:var(--muted)}
.chip{border-radius:4px;padding:1px 7px;font-size:12px;font-weight:500;background:var(--sun);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 20px/1.2 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}
.empty .btn{margin-top:12px}

/* timeline */
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.gscroll{overflow-x:auto;overscroll-behavior-x:contain}
.g-in{position:relative}
.g-row{display:flex;border-top:1px solid var(--line)}
.g-head{border-top:0}
.g-label{position:sticky;left:0;z-index:3;flex:none;width:118px;background:var(--surface);border-right:1px solid var(--line);padding:0 8px;display:flex;align-items:center;font-size:12.5px;line-height:1.2;font-weight:500;text-align:left;border-top:0;border-bottom:0;border-left:0;border-radius:0;overflow:hidden}
.g-label span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-track{position:relative;height:38px;flex:none;background-image:linear-gradient(to right,var(--sun) 0,var(--sun) var(--dw),transparent var(--dw));background-size:calc(var(--dw)*7) 100%;background-repeat:repeat-x}
.g-months{height:24px;border-bottom:1px solid var(--line)}
.g-days{height:22px}
.g-m{position:absolute;top:0;height:24px;padding:4px 6px;font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);white-space:nowrap}
.g-m span{position:sticky;left:124px}
.g-d{position:absolute;top:0;height:22px;text-align:center;font-size:10px;line-height:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1}
.g-bar{position:absolute;top:8px;height:18px;border-radius:3px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;line-height:18px;padding:0 5px;overflow:hidden;white-space:nowrap;z-index:2;border:0;text-align:left}
.g-bar.done{background:var(--ok);color:var(--surface)} .g-bar.late{background:var(--warn);color:var(--surface)} .g-bar.overdue{background:var(--bad);color:var(--surface)}
.g-ghost{position:absolute;top:30px;height:0;border-top:2px dashed var(--muted);opacity:.75;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* daily tasks */
.qa{display:flex;gap:8px}
.qa .inp{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px}
.sec-h h3{margin:0;font:600 16px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.task{display:flex;align-items:flex-start;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px 6px 6px;min-width:0}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:40px;height:40px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.chk::before{content:"";width:24px;height:24px;border:2px solid var(--muted);border-radius:50%;box-sizing:border-box}
.chk:hover::before{border-color:var(--ok)}
.chk.on::before{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";position:absolute;width:6px;height:11px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk{position:relative}
.task-body{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:9px 0 4px;display:flex;flex-direction:column;gap:6px}
.task-title{font-weight:500;overflow-wrap:anywhere}
.task-meta{display:flex;flex-wrap:wrap;gap:6px}
/* labour */
.ldate{display:flex;gap:8px;align-items:stretch}
.ldate .inp{flex:1;min-width:0;text-align:center;font-weight:600}
.ldate .btn{min-width:46px;font-size:20px;line-height:1;padding:6px}
.ltotal{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 13px;margin:10px 0}
.ltotal b{display:block;font:700 36px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ltotal span.lbl{display:block;margin-bottom:4px}
.ltotal .cost{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lhead .lname{min-width:0;flex:1}
.lhead .lsum{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.lhead .lsum b{display:block;font-weight:600}
.lcat{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.lcat .lcn{min-width:0;overflow-wrap:anywhere;font-weight:500}
.lcat .stepper{gap:6px}
.lcat .stepper .inp{max-width:62px;font-size:18px;padding-inline:2px}
.lcat .stepper .btn{min-width:40px;font-size:20px;padding:6px 4px}
.lcat.zero .inp{color:var(--muted)}
.sumbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 13px}
.sumrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sumrow:first-child{border-top:0}
.sumrow .nm{min-width:0;overflow-wrap:anywhere}
.sumrow .vv{flex:none;font-weight:600;white-space:nowrap}
.sumrow .sub{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:6px;margin-bottom:8px;align-items:center}
.catrow.del .inp{text-decoration:line-through;opacity:.5}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.wrow .wn{min-width:0;font-weight:500}
.wrow .inp{max-width:120px}
/* log */
.log{display:flex;flex-direction:column}
.log-item{background:var(--surface);border:1px solid var(--line);border-top-width:0;padding:10px 13px}
.log-item:first-child{border-top-width:1px;border-radius:6px 6px 0 0}
.log-item:last-child{border-radius:0 0 6px 6px}
.log-item:only-child{border-radius:6px}
.log-item time{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,16,22,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88%;overflow-y:auto;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:var(--shadow);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));outline:0}
@media (min-width:700px){.sheet{max-width:540px;margin:0 auto;border:1px solid var(--line)}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh-head h2{margin:0;font:700 24px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.sh-sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label,.lbl{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 10px;min-height:42px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper .inp{text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;max-width:100px}
.stepper .btn{min-width:46px;font-size:20px;line-height:1;padding:6px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.preview{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--bg);border-radius:6px;padding:10px 12px;font-size:14px}
.pv-line{margin:0 0 4px} .muted{color:var(--muted)}
.pv-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.pv-list li{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.pv-list .mv{color:var(--warn);font-weight:600;white-space:nowrap}
.err{color:var(--bad);font-size:13px;margin:4px 0 0}
.dep{border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-bottom:8px;background:var(--surface)}
.dep.on{border-color:var(--accent);background:var(--accent-soft)}
.dep-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dep-name{min-width:0;font-weight:500;overflow-wrap:anywhere}
.dep-sub{font-size:12.5px;color:var(--muted)}
.dep-lag{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;min-height:42px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
textarea.inp{min-height:150px;resize:vertical;font-size:13px}
.prow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow .pd{flex:0 0 96px;color:var(--muted);font-variant-numeric:tabular-nums}.prow .pt{flex:1;min-width:0;overflow-wrap:anywhere}.prow.today{font-weight:600}
.act-plan{margin-top:4px;font-size:13.5px;overflow-wrap:anywhere}
.rp-prev{border:1px solid var(--line);border-radius:8px;max-height:48vh;overflow:auto;background:var(--sun)}
.rp-pg{display:block;width:100%;height:auto;border-bottom:6px solid var(--sun);background:#fff}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="tb">
    <div class="tb-top">
      <div class="tb-left"><button class="btn btn-sm" id="backBtn" data-act="home" type="button" hidden>← All sites</button><span class="eyebrow" id="eyebrow">All sites</span></div>
      <div class="tb-actions">
        <button class="btn btn-sm" id="undoBtn" data-act="undo" type="button" hidden>Undo</button>
        <button class="btn btn-sm" id="repBtn" data-act="open-report" type="button" hidden>Report</button>
        <button class="btn btn-sm" id="setBtn" data-act="settings" type="button" hidden>Site settings</button>
        <button class="btn btn-sm" id="installBtn" data-act="install" type="button" hidden>Install app</button>
        <button class="btn btn-sm" id="bkBtn" data-act="backup" type="button" hidden>Backup</button>
        <button class="btn btn-sm btn-primary" id="addSiteBtn" data-act="add-site" type="button">Add site</button>
      </div>
    </div>
    <h1 id="ttl">Work schedule</h1>
    <dl class="tb-grid" id="tbGrid"></dl>
  </header>
  <div id="banner"></div>
  <div class="bar" id="homeBar">
    <div class="seg" role="group" aria-label="Section">
      <button type="button" data-sec="sites" aria-pressed="true">Sites</button>
      <button type="button" data-sec="tasks" aria-pressed="false">Daily tasks</button>
    </div>
  </div>
  <div id="attention"></div>
  <div class="bar" id="siteBar" hidden>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-tab="list" aria-pressed="true">Activities</button>
      <button type="button" data-tab="gantt" aria-pressed="false">Timeline</button>
      <button type="button" data-tab="labour" aria-pressed="false">Labour</button>
      <button type="button" data-tab="log" aria-pressed="false">Changes</button>
    </div>

function normLabour(l){
  var o={};
  if(!l||typeof l!=='object'||Array.isArray(l))return o;
  Object.keys(l).forEach(function(d){
    var v=l[d];
    if(typeof v==='number'){if(v>0)o[d]={_:v}}
    else if(v&&typeof v==='object'){
      var m={};Object.keys(v).forEach(function(k){var n=parseInt(v[k],10);if(n>0)m[k]=n});
      if(Object.keys(m).length)o[d]=m;
    }
  });
  return o;
}

function dayCost(a,d,cm){var o=(a.labour||{})[d],t=0;if(o)Object.keys(o).forEach(function(k){var c=cm[k];t+=(o[k]||0)*(c?effRate(a,c,d):0)});return t}

    else{

function RDoc(){

  self.table=function(cols,rows,o){

function makePDF(urls){

  for(var i=0;i<n;i++)kids.push((5+3*i)+' 0 R');
  obj(2,'<< /Type /Pages /Count '+n+' /Kids ['+kids.join(' ')+'] >>');
  urls.forEach(function(u,i){
    var bin=atob(u.split(',')[1]),b=new Uint8Array(bin.length);for(var j=0;j<bin.length;j++)b[j]=bin.charCodeAt(j);
    var im=3+3*i;
    offs[im]=len;add(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+b.length+' >>\nstream\n');add(b);add('\nendstream\nendobj\n');
    var cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(im+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    obj(im+2,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+(im+1)+' 0 R >>');
  });

  add('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

      });
      ui.lmsg=cnt?'Copied counts for '+cnt+(cnt===1?' activity':' activities')+' from '+fmtD(prev)+'.':'Nothing to copy from '+fmtD(prev)+'.';
      if(cnt)save();render();break}
    case 'cats':openSheet({mode:'cats'});break;
    case 'open-wages':openSheet({mode:'wages',id:id});break;
    case 'open-plan':openSheet({mode:'plan',id:id});break;
    case 'open-report':openSheet({mode:'report',kind:'client',orig:false});break;
    case 'rp-share':shareReport();break;
    case 'rp-save':if(ui.rep)saveFile(ui.rep.name,ui.rep.blob).then(function(r){rpMsg(r==='declined'?'':'PDF saved.')});break;
    case 'rp-text':shareText();break;
    case 'open-lsetup':openSheet({mode:'lsetup',id:id});break;
    case 'cat-add':{var box=$('#catRows');if(box){box.insertAdjacentHTML('beforeend',catRowHTML(null));var ins=box.querySelectorAll('.cn');ins[ins.length-1].focus()}break}
    case 'cat-del':{var row=t.closest('.catrow');if(row){var on=row.classList.toggle('del');t.textContent=on?'Undo remove':'Remove';row.querySelectorAll('.inp').forEach(function(x){x.disabled=on})}break}
    case 'task-done':completeTask(id);break;
    case 'task-undone':reopenHistory(id);break;
    case 'edit-task':openSheet({mode:'task',id:id});break;
    case 'new-task':openSheet({mode:'task'});break;
    case 'del-task':
      if(!ui.confirmTask){ui.confirmTask=true;drawSheet()}
      else{tcommit(function(){tasksDoc.tasks=tasksDoc.tasks.filter(function(x){return x.id!==id})});closeSheet()}
      break;
    case 'move-overdue':tcommit(function(){tasksDoc.tasks.forEach(function(x){if(!x.done&&dn(x.due)<TODAY)x.due=TODAY_ISO})});break;
    case 'open':openSheet({mode:'activity',id:id});break;
    case 'delay':openSheet({mode:'delay',kind:'late',n:1});break;
    case 'open-delay':openSheet({mode:'delay',id:id,kind:'late',n:1});break;
    case 'open-edit':openSheet({mode:'edit',id:id});break;
    case 'open-done':openSheet({mode:'done',id:id});break;
    case 'open-deps':openSheet({mode:'deps',id:id,deps:clone(actById(id).deps||[])});break;
    case 'add':openSheet({mode:'add',deps:[]});break;
    case 'settings':openSheet({mode:'settings'});break;
    case 'apply':applySheet();break;
    case 'reopen':commit({type:'reopen',id:id});closeSheet();break;
    case 'toggle-pin':commit({type:'pin',id:id,on:!actById(id).pinned});closeSheet();break;
    case 'del':
      if(!ui.confirmDel){ui.confirmDel=true;drawSheet()}
      else{commit({type:'del',id:id});closeSheet()}
      break;
    case 'quick-extend':{var a=actById(id);openSheet({mode:'delay',id:id,kind:'long',n:Math.min(90,Math.max(1,TODAY-dn(a.end)))});break}
    case 'reset':
      if(!ui.confirmReset){ui.confirmReset=true;drawSheet()}
      else{pushUndo();applyOp(doc.activities,{type:'reset'},ctx());logEntry('All dates reset to the original plan.');save();closeSheet();render()}
      break;
    case 'copy':{
      var ta=$('#st-copy'),msg=$('#copyMsg');
      var done=function(){msg.textContent='Copied.'},fail=function(){ta.focus();ta.select();msg.textContent='Select the text and copy it.'};
      try{navigator.clipboard.writeText(ta.value).then(done,fail)}catch(err){fail()}
      break}
    case 'save-settings':{
      var ti=$('#st-t').value.trim()||doc.name,cl=$('#st-c').value.trim(),sun=$('#st-sun').checked;
      if(ti!==doc.name||cl!==(doc.client||'')||sun!==(doc.settings.sundayOff!==false)){pushUndo();doc.name=ti;doc.client=cl;doc.settings.sundayOff=sun;save()}
      closeSheet();render();break}
  }
});
document.addEventListener('input',function(e){
  if(!ui.sheet||!e.target.closest('#sheet'))return;
  if(e.target.id==='as-from'){var w=$('#as-startWrap');if(w)w.hidden=!e.target.value;return}
  if(e.target.id!=='st-t'&&e.target.id!=='st-c'&&e.target.id!=='ad-n'&&e.target.id!=='st-copy'&&e.target.id!=='as-n'&&e.target.id!=='as-c')updatePreview();
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.name==='lm'){var bx=$('#lm-cats'),tc=$('#lm-c');if(bx&&tc)bx.hidden=tc.checked;return}
  if(el.classList&&el.classList.contains('lab-n')){var a=actById(el.dataset.id);if(a){setLab(a,labDate(),el.dataset.lc,el.value);save();render()}return}
  if(el.id==='rp-orig'){ui.sheet.orig=el.checked;genReport();return}
  if(el.id==='ld-in'){if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){ui.ld=el.value;render()}return}
  if(el.id==='ld-add'){var b=actById(el.value),cs=b?actCats(b):[];if(b&&cs.length){setLab(b,labDate(),cs[0].id,1);save();render()}return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet()});

document.addEventListener('submit',function(e){
  if(e.target.id!=='qaForm')return;
  e.preventDefault();
  var v=$('#qa-t').value.trim();if(!v)return;
  ui.tt='today';
  tcommit(function(){tasksDoc.tasks.push({id:newId('t'),title:v,due:TODAY_ISO,cat:ui.cat||'',prio:'normal',repeat:'none',note:'',done:false})});
  var again=$('#qa-t');if(again)again.focus();
});

// ---------- backup and restore ----------
function lastBackup(){try{var v=localStorage.getItem('ws1:lastBackup');return v?new Date(v):null}catch(e){return null}}
function markBackup(){try{localStorage.setItem('ws1:lastBackup',new Date().toISOString())}catch(e){}}
function backupNote(){
  if(!Object.keys(docs).length&&!tasksDoc.tasks.length)return '';
  var lb=lastBackup();if(lb&&(Date.now()-lb.getTime())<30*864e5)return '';
  return '<div class="note"><h3>Back up your data</h3>Everything is stored on this phone only. '+(lb?'Your last backup was over 30 days ago.':'You have not made a backup yet.')+'<div class="attn-btns" style="margin-top:8px"><button class="btn btn-sm btn-primary" type="button" data-act="backup">Back up now</button></div></div>';
}
function buildBackup(){return {app:'work-schedule',version:1,exportedAt:new Date().toISOString(),sites:clone(docs),daily:clone(tasksDoc)}}
function backupName(){return 'work-schedule-backup-'+TODAY_ISO+'.json'}
function backupCounts(b){var ks=Object.keys(b.sites||{}),n=0;ks.forEach(function(k){n+=(b.sites[k].activities||[]).length});return {sites:ks.length,acts:n,tasks:((b.daily||{}).tasks||[]).length}}
function validBackup(b){return !!b&&b.app==='work-schedule'&&!!b.sites&&typeof b.sites==='object'&&Object.keys(b.sites).every(function(k){var x=b.sites[k];return x&&Array.isArray(x.activities)})}
function bkMsg(t){var m=$('#bk-msg');if(m)m.textContent=t}
function doExport(){
  try{
    var blob=new Blob([JSON.stringify(buildBackup(),null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=backupName();document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
    markBackup();bkMsg('Saved as '+backupName()+'. Look in your Downloads, then keep a copy in Drive or send it to yourself.');
  }catch(e){bkMsg('The file could not be created. Try Share backup.')}
}
function shareExport(){
  try{
    var f=new File([JSON.stringify(buildBackup(),null,1)],backupName(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Work Schedule backup'}).then(function(){markBackup();bkMsg('Backup shared.')},function(){});}
    else bkMsg('Sharing is not available here. Use Download backup.');
  }catch(e){bkMsg('Sharing is not available here. Use Download backup.')}
}
function doImport(){
  var b=ui.sheet&&ui.sheet.pending;if(!b||!col||!tref)return;
  var nd={};Object.keys(b.sites).forEach(function(k){nd[k]=normalize(clone(b.sites[k]))});
  var td=normT(clone(b.daily||{})),jobs=[],stamp=new Date().toISOString();
  Object.keys(docs).forEach(function(k){if(!nd[k])jobs.push(col.doc(k).delete())});
  Object.keys(nd).forEach(function(k){var p=clone(nd[k]);p.updatedAt=stamp;jobs.push(col.doc(k).set(p))});
  var tp=clone(td);tp.updatedAt=stamp;jobs.push(tref.set(tp));
  Promise.all(jobs).then(function(){saveErr=''}).catch(function(e){saveErr=(e&&e.message)||'Could not restore the backup'}).then(function(){
    docs=nd;tasksDoc=td;undoStack=[];taskUndo=[];closeSheet();goHome();
  });
}
document.addEventListener('change',function(e){
  if(e.target.id!=='bk-file'||!ui.sheet||ui.sheet.mode!=='backup')return;
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var b=null;try{b=JSON.parse(rd.result)}catch(x){}
    if(!validBackup(b)){ui.sheet.pending=null;drawSheet();$('#bk-err').innerHTML='<p class="err">This file is not a Work Schedule backup.</p>';return}
    ui.sheet.pending=b;ui.sheet.pendingName=f.name;drawSheet();
  };
  rd.onerror=function(){$('#bk-err').innerHTML='<p class="err">The file could not be read.</p>'};
  rd.readAsText(f);
});
window.addEventListener('ws-install',function(){render()});

// ---------- start ----------
render();
(async function(){
  var db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(err){db=null}
  if(!db){dbOn=false;loaded=true;tloaded=true;docs={};render();return}
  dbOn=true;col=db.collection('sites');
  tref=db.doc('daily/main');
  tref.onSnapshot(function(snap){
    if(tinflight>0)return;
    tasksDoc=normT(snap.exists?clone(snap.data()):{});tloaded=true;render();
  },function(){tloaded=true;render()});
  col.onSnapshot(function(snap){
    if(inflight>0)return;
    var nd={};
    snap.docs.forEach(function(d){nd[d.id]=normalize(clone(d.data()))});
    docs=nd;loaded=true;
    if(curId){if(docs[curId])doc=docs[curId];else{curId=null;doc=null;closeSheet()}}
    render();
  },function(){
    dbOn=false;loaded=true;render();
  });
})();
})();
</script>
